name: Public application integration
on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - architecture/**
      - scripts/**
      - tests/**
      - playwright*.mjs
      - mani.yaml
      - package.json
      - pnpm-lock.yaml
      - .go-version
      - .node-version
      - workspace.lock.json
      - .github/workflows/applications.yml
  push:
    branches:
      - develop
      - main
    paths:
      - architecture/**
      - scripts/**
      - tests/**
      - playwright*.mjs
      - mani.yaml
      - package.json
      - pnpm-lock.yaml
      - .go-version
      - .node-version
      - workspace.lock.json
      - .github/workflows/applications.yml
  workflow_dispatch:
    inputs:
      platform_commit:
        description: Full candidate SHA, or empty for develop
        type: string
      web_commit:
        description: Full candidate SHA, or empty for develop
        type: string
      admin_commit:
        description: Full candidate SHA, or empty for develop
        type: string
      catalog_commit:
        description: Full candidate SHA, or empty for develop
        type: string
      reviews_commit:
        description: Full candidate SHA, or empty for develop
        type: string
      moderation_commit:
        description: Full candidate SHA, or empty for develop
        type: string
      storage_commit:
        description: Full candidate SHA, or empty for develop
        type: string
      media_commit:
        description: Full candidate SHA, or empty for develop
        type: string
      resources_commit:
        description: Full candidate SHA, or empty for develop
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{
    github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    name: Public contract and build verification
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      platform: ${{ steps.checked.outputs.platform }}
      web: ${{ steps.checked.outputs.web }}
      admin: ${{ steps.checked.outputs.admin }}
    env:
      LEFTHOOK: "0"
      GOWORK: off
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Resolve source refs
        id: refs
        env:
          PLATFORM: ${{ inputs.platform_commit }}
          WEB: ${{ inputs.web_commit }}
          ADMIN: ${{ inputs.admin_commit }}
          CATALOG: ${{ inputs.catalog_commit }}
          REVIEWS: ${{ inputs.reviews_commit }}
          MODERATION: ${{ inputs.moderation_commit }}
          STORAGE: ${{ inputs.storage_commit }}
          MEDIA: ${{ inputs.media_commit }}
          RESOURCES: ${{ inputs.resources_commit }}
        run: node scripts/integration-refs.mjs
      - uses: actions/checkout@v7.0.1
        with:
          repository: StuHelper/stuhelper-platform
          ref: ${{ steps.refs.outputs.platform }}
          path: workspace/platform
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: StuHelper/stuhelper-web
          ref: ${{ steps.refs.outputs.web }}
          path: workspace/web
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: StuHelper/stuhelper-admin
          ref: ${{ steps.refs.outputs.admin }}
          path: workspace/admin
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: StuHelper/stuhelper-catalog
          ref: ${{ steps.refs.outputs.catalog }}
          path: workspace/catalog
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: StuHelper/stuhelper-reviews
          ref: ${{ steps.refs.outputs.reviews }}
          path: workspace/reviews
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: StuHelper/stuhelper-moderation
          ref: ${{ steps.refs.outputs.moderation }}
          path: workspace/moderation
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: StuHelper/stuhelper-storage
          ref: ${{ steps.refs.outputs.storage }}
          path: workspace/storage
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: StuHelper/stuhelper-media
          ref: ${{ steps.refs.outputs.media }}
          path: workspace/media
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: StuHelper/stuhelper-resources
          ref: ${{ steps.refs.outputs.resources }}
          path: workspace/resources
          fetch-depth: 0
          persist-credentials: false
      - uses: StuHelper/stuhelper-tooling/actions/setup@v0.1.11
        with:
          go-version-file: .go-version
          go-cache-dependency-path: workspace/*/go.sum
          pnpm-cache-dependency-path: |
            pnpm-lock.yaml
            workspace/web/pnpm-lock.yaml
            workspace/admin/pnpm-lock.yaml
      - name: Pin browser jobs to the checked-out commits
        id: checked
        shell: bash
        run: |
          set -euo pipefail
          for name in platform web admin; do
            revision=$(git -C "workspace/$name" rev-parse --verify 'HEAD^{commit}')
            printf '%s=%s\n' "$name" "$revision" >> "$GITHUB_OUTPUT"
          done
      - name: Record actual source combination and check contracts
        run: |
          pnpm install --frozen-lockfile
          make setup-contracts
          node scripts/workspace.mjs snapshot
          node scripts/workspace.mjs toolchains
          node scripts/workspace.mjs contracts --scope=platform,web,admin,catalog,reviews,moderation,storage,media,resources
      - name: Build public example and clients
        run: |
          (cd workspace/platform && go build -mod=readonly -o bin/stuhelper-platform ./examples/server)
          pnpm --dir workspace/web install --frozen-lockfile
          pnpm --dir workspace/web run build
          pnpm --dir workspace/admin install --frozen-lockfile
          pnpm --dir workspace/admin run setup
          pnpm --dir workspace/admin run build
  browser:
    name: Browser (${{ matrix.suite }})
    needs: contracts
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite:
          - framework
          - academic
          - web-resources
          - admin-resources
    env:
      LEFTHOOK: "0"
      GOWORK: off
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        if: matrix.suite == 'framework'
        with:
          repository: StuHelper/stuhelper-platform
          ref: ${{ needs.contracts.outputs.platform }}
          path: workspace/platform
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        if: matrix.suite != 'admin-resources'
        with:
          repository: StuHelper/stuhelper-web
          ref: ${{ needs.contracts.outputs.web }}
          path: workspace/web
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        if: matrix.suite != 'web-resources'
        with:
          repository: StuHelper/stuhelper-admin
          ref: ${{ needs.contracts.outputs.admin }}
          path: workspace/admin
          persist-credentials: false
      - uses: StuHelper/stuhelper-tooling/actions/setup@v0.1.11
        with:
          go-version-file: ${{ matrix.suite == 'framework' && '.go-version' || '' }}
          go-cache-dependency-path: workspace/platform/go.sum
          pnpm-cache-dependency-path: |
            pnpm-lock.yaml
            workspace/web/pnpm-lock.yaml
            workspace/admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: StuHelper/stuhelper-tooling/actions/chromium@v0.1.11
      - name: Build platform public server
        if: matrix.suite == 'framework'
        run: (cd workspace/platform && go build -mod=readonly -o bin/stuhelper-platform ./examples/server)
      - name: Build Web client
        if: matrix.suite != 'admin-resources'
        run: |
          pnpm --dir workspace/web install --frozen-lockfile
          pnpm --dir workspace/web run build
      - name: Build Admin client
        if: matrix.suite != 'web-resources'
        run: |
          pnpm --dir workspace/admin install --frozen-lockfile
          pnpm --dir workspace/admin run setup
          pnpm --dir workspace/admin run build
      - name: Run framework browser suite
        if: matrix.suite == 'framework'
        run: pnpm run test:e2e
      - name: Run academic browser suite
        if: matrix.suite == 'academic'
        run: pnpm exec playwright test --config playwright.academic.config.mjs
      - name: Run Web resources browser suite
        if: matrix.suite == 'web-resources'
        run: pnpm --dir workspace/web exec playwright test tests/e2e/resources.spec.mjs
      - name: Run Admin resources browser suite
        if: matrix.suite == 'admin-resources'
        run: pnpm --dir workspace/admin exec playwright test --config playwright.storage.config.mjs tests/e2e/resources.spec.mjs
